[package]
name = "smainer"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.16.0"
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts", tag = "v0.20.0" }
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.57.0" }

[[target.starknet-contract]]
